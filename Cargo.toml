[package]
name = "tap"
version = "0.1.1"
edition = "2021"
authors = ["arif39x,aliarif1168@gmail.com"]
description = "Process introspection for humans."
license = "MIT"

[lib]
name = "_proctrace_core"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
pyo3 = { version = "0.29", features = ["extension-module"] }
thiserror = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
