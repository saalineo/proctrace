[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "proctrace"
version = "0.1.1"
description = "Process introspection for humans."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
proctrace = "proctrace.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "maturin>=1.5",
    "twine>=5.0",
]

[project.entry-points.pytest11]
proctrace = "proctrace.pytest_plugin"

[tool.maturin]
module-name = "proctrace._proctrace_core"
python-packages = ["proctrace"]
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
